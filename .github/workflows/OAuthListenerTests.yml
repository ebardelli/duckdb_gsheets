name: OAuth Listener Tests

on:
  workflow_call:

concurrency:
  group: oauth-listener-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oauth-listener-tests:
    name: Run OAuth listener tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: ccache-oauth-listener-tests

      - name: Build and run OAuth listener tests
        run: make test_oauth_listener
        env:
          GEN: ninja
          EXT_FLAGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run COPY TO tests
        run: make test_copy_function
        env:
          GEN: ninja
          EXT_FLAGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run auth factory tests
        run: make test_auth_factory
        env:
          GEN: ninja
          EXT_FLAGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
