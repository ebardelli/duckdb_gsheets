name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write
  pages: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm install --prefix docs

      - name: Build static files
        run: npm run build --prefix docs

      - name: Get Pages base path
        id: pages
        uses: actions/configure-pages@v5

      # Evidence's app.html links its icons from the site root, which 404s on a
      # project site served from /<repo>/
      - name: Prefix root-relative icon links with the base path
        if: steps.pages.outputs.base_path != ''
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          find docs/build -name '*.html' -exec sed -i -E \
            "s#href=\"/(favicon\.ico|icon\.svg|apple-touch-icon\.png|manifest\.webmanifest)\"#href=\"${BASE_PATH}/\1\"#g" {} +

      # Serve the signed binaries attached to the GitHub releases as a DuckDB extension repository
      - name: Build extension repository
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=()
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
              --json tagName,createdAt --jq 'sort_by(.createdAt) | .[].tagName'); do
            dir="$RUNNER_TEMP/releases/$tag"
            mkdir -p "$dir"
            gh release download "$tag" --pattern 'gsheets-*.duckdb_extension.gz' \
              --pattern 'gsheets-*.duckdb_extension.wasm' --dir "$dir" || true
            releases+=("$tag=$dir")
          done
          python3 scripts/build_extension_repo.py --out docs/build/extensions \
            --public-key scripts/extension_signing_public_key.pem "${releases[@]}"

      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
